# git-cliff config — generates CHANGELOG.md from Conventional Commit history.
# Prefix table and bump rules: see RELEASES.md's "Conventional Commits" section.
# Run via `cargo release` (see RELEASES.md's Release flow) — never in CI on push.

[changelog]
header = """
# Changelog

All notable changes to dissonanza. Generated from Conventional Commit messages by `git-cliff` at release time; do not edit by hand.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*.[0-9]*.[0-9]*"
sort_commits = "oldest"

# Order matters: git-cliff takes the first matching parser, so the breaking-change
# check must come before feat/fix or a `feat!:` commit would group as Added instead.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Fixed" },
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^revert", skip = true },
]
